openapi: 3.0.3
info:
  title: PrepAI API
  version: 0.1.0
  description: Contract for the MVP. All routes except /auth/register, /auth/login and /health require authentication. Errors always use the Error schema.
servers:
  - url: /api/v1
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: access_token }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string, enum: [VALIDATION_ERROR, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT, RATE_LIMITED, QUOTA_EXCEEDED, FILE_INVALID, AI_UNAVAILABLE, AI_INVALID_OUTPUT, INTERNAL_ERROR] }
            message: { type: string }
            requestId: { type: string }
    Page:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer, maximum: 50 }
        total: { type: integer }
  parameters:
    page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
    id: { name: id, in: path, required: true, schema: { type: string, pattern: '^[a-f0-9]{24}$' } }
  responses:
    Err: { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
security:
  - cookieAuth: []
paths:
  /auth/register:
    post: { tags: [Auth], security: [], summary: Create account, responses: { '201': { description: Created }, '400': { $ref: '#/components/responses/Err' }, '409': { $ref: '#/components/responses/Err' } } }
  /auth/login:
    post: { tags: [Auth], security: [], summary: Log in (rate limited; generic failure message), responses: { '200': { description: Sets httpOnly cookies }, '401': { $ref: '#/components/responses/Err' }, '429': { $ref: '#/components/responses/Err' } } }
  /auth/refresh:
    post: { tags: [Auth], summary: Rotate refresh token (reuse revokes the whole family), responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/Err' } } }
  /auth/logout:
    post: { tags: [Auth], summary: Revoke session, responses: { '204': { description: No content } } }
  /me:
    get: { tags: [Profile], summary: Current user, responses: { '200': { description: OK } } }
    patch: { tags: [Profile], summary: Update profile, responses: { '200': { description: OK }, '400': { $ref: '#/components/responses/Err' } } }
    delete: { tags: [Profile], summary: Request account and data deletion, responses: { '202': { description: Accepted } } }
  /resumes:
    post: { tags: [Resumes], summary: Upload resume (multipart, PDF/DOCX, max 5 MB), responses: { '202': { description: Accepted, analysis job queued }, '400': { $ref: '#/components/responses/Err' } } }
    get: { tags: [Resumes], summary: List own resumes, parameters: [ { $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/limit' } ], responses: { '200': { description: OK } } }
  /resumes/{id}:
    get: { tags: [Resumes], summary: Get resume and analysis status (owner only), parameters: [ { $ref: '#/components/parameters/id' } ], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Err' } } }
    delete: { tags: [Resumes], summary: Delete resume and stored file, parameters: [ { $ref: '#/components/parameters/id' } ], responses: { '204': { description: Deleted } } }
  /job-matches:
    post: { tags: [Job matching], summary: Match resume to a job description (async), responses: { '202': { description: Accepted }, '429': { $ref: '#/components/responses/Err' } } }
  /job-matches/{id}:
    get: { tags: [Job matching], summary: Get result, parameters: [ { $ref: '#/components/parameters/id' } ], responses: { '200': { description: OK } } }
  /interviews:
    post: { tags: [Interviews], summary: Start a mock interview, responses: { '201': { description: Created, first question returned }, '429': { $ref: '#/components/responses/Err' } } }
    get: { tags: [Interviews], summary: List own sessions, parameters: [ { $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/limit' } ], responses: { '200': { description: OK } } }
  /interviews/{id}/answers:
    post: { tags: [Interviews], summary: Submit an answer, receive feedback and next question, parameters: [ { $ref: '#/components/parameters/id' } ], responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Err' } } }
  /interviews/{id}/complete:
    post: { tags: [Interviews], summary: Finish session and get overall summary, parameters: [ { $ref: '#/components/parameters/id' } ], responses: { '200': { description: OK } } }
  /study/ask:
    post: { tags: [Study assistant], summary: Ask a question; returns grounded answer with citations or sufficientEvidence=false, responses: { '200': { description: OK }, '429': { $ref: '#/components/responses/Err' } } }
  /study/conversations:
    get: { tags: [Study assistant], summary: List own conversations, parameters: [ { $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/limit' } ], responses: { '200': { description: OK } } }
  /dsa:
    get: { tags: [DSA], summary: List problems (filters topic, difficulty, status), parameters: [ { $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/limit' } ], responses: { '200': { description: OK } } }
    post: { tags: [DSA], summary: Add problem, responses: { '201': { description: Created }, '409': { $ref: '#/components/responses/Err' } } }
  /dsa/{id}:
    patch: { tags: [DSA], summary: Update problem, parameters: [ { $ref: '#/components/parameters/id' } ], responses: { '200': { description: OK } } }
    delete: { tags: [DSA], summary: Delete problem, parameters: [ { $ref: '#/components/parameters/id' } ], responses: { '204': { description: Deleted } } }
  /dashboard:
    get: { tags: [Dashboard], summary: Aggregated progress and recommendations, responses: { '200': { description: OK } } }
  /admin/documents:
    post: { tags: [Admin], summary: Upload study material (admin only, audited), responses: { '202': { description: Accepted, ingestion queued }, '403': { $ref: '#/components/responses/Err' } } }
    get: { tags: [Admin], summary: List study materials, parameters: [ { $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/limit' } ], responses: { '200': { description: OK } } }
  /admin/documents/{id}:
    delete: { tags: [Admin], summary: Archive and de-index a document, parameters: [ { $ref: '#/components/parameters/id' } ], responses: { '204': { description: Archived } } }
  /admin/users:
    get: { tags: [Admin], summary: List users (no sensitive fields), parameters: [ { $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/limit' } ], responses: { '200': { description: OK } } }
  /health:
    get: { tags: [Platform], security: [], summary: Liveness, responses: { '200': { description: OK } } }
  /ready:
    get: { tags: [Platform], security: [], summary: Readiness (database reachable), responses: { '200': { description: Ready }, '503': { description: Degraded } } }
